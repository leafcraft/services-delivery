# services-delivery — Services Delivery (billable engagement work)
#
# A TEAM that does the routine ~65% of consulting / professional-services
# delivery work: brief intake, research, context, analysis+draft
# (one consultant role), QA.
# Engagement lead + associates / senior consultants / SMEs / partner
# stay in the loop — every deliverable goes to a human BEFORE the
# client ever sees it.
#
# Rule 1: peer-to-peer. research ↔ context cross-reference; brief
# fans out to research+context in parallel; the consultant fans in;
# QA can kick the draft back with a feedback rerun (yields-driven
# enforcement).
#
# ═══════════════════════════════════════════════════════════════════
# WHY LEAFMESH (the value the ROI calculator quantifies)
# ═══════════════════════════════════════════════════════════════════
# Per the ROI doc, professional services is the SHARPEST single case
# — your billable people are BOTH your biggest cost AND all your
# revenue, so one improvement compounds on both sides at once:
#
#   util (output/head)    — pool 30% of revenue, routine 65%, rev type
#   hours (fewer hours)   — pool 18% of revenue, routine 65%, rev type
#
# Same mesh, two metrics. Cost out + revenue added land together.
#
# Control-plane primitives this template uses:
#   1. PEER-TO-PEER — brief fans to research+context in parallel;
#      research ↔ context call each other; the consultant fans in;
#      QA can send the draft back with feedback (yields-driven retry).
#   2. MULTI-ENTRY — 7 entry points (kickoff, client question, weekly
#      sync, deliverable due, escalation, knowledge update, manual).
#   3. NEVER AUTO-DELIVER — engagement_lead_human ALWAYS reviews
#      before the client sees output. No bypass.
#   4. CITATION-OR-NOTHING — any factual claim must have a citation
#      (citation_agent enforces). Uncited claims trigger a rerun.
#   5. KNOWLEDGE-GROUNDED — past_projects, methodology, industry_reports,
#      client_context. Domain SMEs update the docs; agents pick them
#      up immediately.
#   6. THINKING MODE on the consultant — Claude Sonnet with
#      thinking_budget for the reasoning-heavy step.
#   7. SCHEDULED weekly-sync — status_sweep_orchestrator pulls the
#      active-engagement sweep from YOUR PSA / project tracker (cron
#      ships commented out until the connector is wired).
#   8. EVENT-BUS subscribers — every QA outcome, every escalation,
#      every deliverable approval is audited out-of-band.
#   9. YAML-FIRST — utilisation/hours live in YOUR PSA/timesheet
#      system (Harvest / Toggl / ClickTime / Tempo), not a template
#      database. Connector agents front those systems; Python remains
#      only where it MUST be (citation maths, the context loop guard,
#      the pre-gate stash writer on qa_agent).

name: "services-delivery"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

# ═══════════════════════════════════════════════════════════════════
# REDIS — engagement context, deliverable history, citation cache
# ═══════════════════════════════════════════════════════════════════
redis:
  host: "${REDIS_HOST:localhost}"
  port: ${REDIS_PORT:6379}
  db: 0
  password: "${REDIS_PASSWORD:}"
  auto_storage: true
  decode_responses: true
  default_ttl: 86400
  session_ttl: 2592000             # 30 days — engagement state outlives sessions

# ═══════════════════════════════════════════════════════════════════
# AUTO-DISCOVER
# ═══════════════════════════════════════════════════════════════════
auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# ═══════════════════════════════════════════════════════════════════
# MANAGER
# ═══════════════════════════════════════════════════════════════════
manager:
  enabled: true
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true

  prompt: |
    This mesh runs professional-services delivery — research, analysis,
    drafting, QA for billable engagements. A successful engagement turn:
      - brief_intake normalizes the inbound request into a canonical
        brief (scope, deliverable, deadline)
      - research + context fan out in parallel; research pulls
        prior-art + industry data, context pulls client-specific history
      - the consultant (one role) applies reasoning (Claude + thinking
        budget) over the synthesised context AND writes the first-pass
        deliverable; QA fact-checks; citation_agent verifies sources
      - engagement_lead_human reviews before the client sees anything
      - the assigned IC tier (associate / senior / SME) does the human
        editing pass — the tier matrix is wired as visible conditions
        on qa_agent's outbound edges (no router agent)
      - billable hours / utilisation come from the firm's PSA/timesheet
        system via timesheet_connector_agent; engagement_controller
        judges SOW drift on top of those numbers

    Escalate when:
      - QA finds uncited factual claims after 2 retries
      - consultant confidence < 0.7 on a strategic engagement
      - deliverable due within 24h and engagement_lead hasn't responded
      - client escalation received (immediate to partner_human)
      - same client gets the same "I don't know" answer 3+ times

    Watch for:
      - patterns where research has thin knowledge coverage
        (the knowledge base needs new ingestion)
      - drafts that consistently get heavy editing — the consultant
        prompt needs tuning
      - engagement-lead overload (one PM running too many parallel
        engagements; load-balance via partner)

  routing:
    mode: "learning"           # delivery patterns are learnable
    memory_size: 250
    confidence_threshold: 0.7
    fallback: "all"
    decay_days: 45

  knowledge:
    serviceName: "mongo_main"
    enabled: true
    groupName: "delivery_methodology"

  escalation:
    targets:
      - type: "human_agent"
        agent: "partner_human"
      - type: "webhook"
        url: "${PAGER_WEBHOOK:https://events.pagerduty.com/v2/enqueue}"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload_template:
          incident_id: "{{engagement_id}}"
          severity: "{{severity}}"
          message: "{{message}}"
          session_id: "{{session_id}}"
      - type: "channel"
        provider: "slack"
        channel_id: "${SLACK_DELIVERY_CHANNEL:}"
        message_template: "[delivery] {{message}} — engagement {{engagement_id}} (session {{session_id}})"

    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3
      timeout_threshold: 2

  health_check_interval: 60
  agent_timeout_threshold: 300       # analysis can run long
  chain_completion_timeout: 600

# ═══════════════════════════════════════════════════════════════════
# MESH
# ═══════════════════════════════════════════════════════════════════
mesh:
  call_timeout: 120                   # consulting research is slower than ticket triage

# ═══════════════════════════════════════════════════════════════════
# DATA STRUCTURES
# ═══════════════════════════════════════════════════════════════════
data_structures:
  EngagementBrief:
    type: "object"
    properties:
      engagement_id: { type: "string" }
      client_id: { type: "string" }
      practice_area: { type: "string" }       # strategy | tech | ops | research | …
      deliverable_type: { type: "string" }    # memo | deck | model | report | recommendation
      scope_summary: { type: "string" }
      deadline_utc: { type: "string" }
      strategic_account: { type: "boolean" }
      requires_research: { type: "boolean" }
      received_at_utc: { type: "string" }
      raw_payload: { type: "object" }
    required: ["engagement_id", "client_id", "deliverable_type"]

  Deliverable:
    type: "object"
    properties:
      deliverable_id: { type: "string" }
      sections: { type: "list" }
      citations: { type: "list" }
      open_questions: { type: "list" }
      confidence: { type: "number" }
      uncited_claims: { type: "list" }
    required: ["deliverable_id", "sections"]

# ═══════════════════════════════════════════════════════════════════
# ENTRY POINTS — Rule 1: 7 ways the team can be triggered
# ═══════════════════════════════════════════════════════════════════
entry_points:
  - name: "new_engagement"
    target: "brief_intake_agent"
    description: "Engagement kickoff — new brief arrives"

  - name: "client_question"
    target: "context_agent"
    description: "Mid-engagement client message (no brief intake needed)"

  - name: "weekly_sync"
    target: "status_sweep_orchestrator_agent"
    description: "Scheduled — Monday 09:00 — status report across active engagements"

  - name: "deliverable_due"
    target: "consultant_agent"
    description: "Deliverable deadline approaches — analyse + start the draft (context assumed cached)"

  - name: "escalation_received"
    target: "partner_human"
    description: "Client/internal escalation — straight to partner"

  - name: "knowledge_update"
    target: "research_agent"
    description: "New domain knowledge to absorb (industry report, methodology update)"

  - name: "manual_action"
    target: "consultant_agent"
    description: "Engagement-lead-initiated deliverable work — analyse + draft on demand; QA's tier wires pick the editing IC"

  - name: "draft_client_status"
    target: "engagement_status_drafter_agent"
    description: "Friday weekly client status report"

  - name: "daily_standup_brief"
    target: "engagement_status_drafter_agent"
    description: "Daily client standup brief — terser, lead-only audience"

  - name: "log_time_entry"
    target: "timesheet_connector_agent"
    description: "Record one billable / non-billable time entry — forwarded to YOUR PSA/timesheet system (ingest mode)"

  - name: "scope_creep_check"
    target: "timesheet_connector_agent"
    description: "Pull aggregated hours + budget position from the PSA, then SOW-drift judgment — engagement-lead-initiated"

  - name: "monthly_steering_pack"
    target: "engagement_status_drafter_agent"
    description: "Monthly steering committee pack — exec audience, risks + budget"

# ═══════════════════════════════════════════════════════════════════
# AGENTS — The team
#
# Mesh shape (peer-to-peer, Rule 1):
#
#   new_engagement      → brief_intake_agent (LLM)
#                              │
#                  ┌───────────┼─────────────────┐
#                  │           │ (always)        │ (if requires_research)
#                  │           ▼                 ▼
#                  │     context_agent     research_agent
#                  │     (LLM)             (LLM, knowledge:
#                  │       ▲                 industry_reports +
#                  │       │                 past_projects)
#                  │       └───── peer-to-peer cross-reference ───┐
#                  │                                              │
#   client_question                                               │
#                  │                                              ▼
#                  ▼                                       (fan-in)
#                                                            │
#   deliverable_due ─────────────────────────────────► consultant_agent
#                                                       (Claude + thinking;
#                                                        analyses AND drafts)
#                                                            │
#                                                            ▼
#                                                       qa_agent (LLM)
#                                                            │
#                              ┌─────────────────────────────┼──────────────┐
#                              │                             │              │
#                              ▼ (if factual claims)         ▼ (clean)      ▼ (uncited)
#                       citation_agent (programmatic)        │              [rerun loop
#                                  │                          │               via enforce_yields]
#                                  ▼                          │
#                                                             │
#                              ┌──────────────────────────────┘
#                              ▼ (always — never bypass)
#                       engagement_lead_human (HITL)
#                              │
#   qa_agent ALSO fans the editing pass to the IC tier — the
#   stakes→tier matrix is VISIBLE conditions on qa's outbound wires:
#               ┌──────────────┬───────────────┬─────────────────┐
#               ▼              ▼               ▼                 ▼
#         associate_human  senior_…      sme_human          partner_human
#         (routine)       (rec/strategic) (SME area/low conf) (escalation)
#               │              │               │
#               └─────── all → delivery_audit_logger_agent (hash-chained WORM)
#
#   log_time_entry / scope_creep_check ──► timesheet_connector_agent
#     (YOUR PSA/timesheet system) ──► engagement_controller_agent
#     (SOW-drift judgment) ──► engagement_lead_human | audit
#
#   escalation_received ──────────────► partner_human (direct)
#
#   weekly_sync (cron) ──► status_sweep_orchestrator_agent
#     (parallel — not in per-engagement flow)
# ═══════════════════════════════════════════════════════════════════

# ── Direct-call entry points (every non-human, non-terminal
#    agent is API-addressable; bypasses the upstream chain).
#    Use for ad-hoc invocation, debugging, programmatic ingest.
  - name: "direct_call_consultant"
    target: "consultant_agent"
    description: "On-demand direct call to consultant (llm, analysis+draft) — bypasses upstream chain"

  - name: "direct_call_qa"
    target: "qa_agent"
    description: "On-demand direct call to qa (llm) — bypasses upstream chain"

  - name: "direct_call_citation"
    target: "citation_agent"
    description: "On-demand direct call to citation (programmatic) — bypasses upstream chain"

  - name: "direct_call_engagement_controller"
    target: "engagement_controller_agent"
    description: "On-demand direct call to engagement_controller (llm, SOW-drift judgment) — bypasses the PSA connector"

  # ── Lyzr-inspired agents (added in 2.3.x) ──
  - name: "draft_consultant_review"
    target: "performance_review_agent"
    description: "Q/Annual review draft for billable staff — client csat + repeat + outcomes weighted"

  - name: "engagement_close_knowledge_capture"
    target: "doc_extraction_agent"
    description: "At engagement close — mine deliverables for reusable IP into firm-wide KB"


agents:

  # ────────────────────────────────────────────────────────────
  # brief_intake_agent — normalizes inbound briefs
  # ────────────────────────────────────────────────────────────
  brief_intake_agent:
    name: "brief_intake_agent"
    agent_type: "llm"
    description: "Normalizes inbound engagement briefs into canonical EngagementBrief"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1000
    communication_type: "chain"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"engagement_id": "", "client_id": "", "practice_area": "", "deliverable_type": "", "scope_summary": "", "deadline_utc": "", "strategic_account": false, "requires_research": false, "raw_payload": {}, "requires_human_clarification": false, "missing_fields": []}
      You normalise an inbound brief into a canonical EngagementBrief.

      NOTE: a @pre_compose processor has already pulled any PRIOR brief
      for this engagement (prior_brief, prior_client_id,
      prior_practice_area, prior_scope_summary) into prepared_data —
      carry those forward rather than re-deriving and losing them.
      The brief might arrive as an email thread, a Slack message, a
      DocSend link summary, a written SOW, or a verbal-meeting note
      (transcribed). Pull:
        - client_id (from prior CRM context or explicit mention)
        - practice_area (strategy / tech / ops / research / market /…)
        - deliverable_type (memo / deck / model / report / recommendation)
        - scope summary (1-2 sentences — what they're actually asking for)
        - deadline (UTC ISO; if vague, leave empty and flag for PM)
        - strategic_account (true if client is in the top-tier account list)
        - requires_research (false ONLY if the brief is so client-specific
          that no external research is needed; default to true otherwise)

      Hard rules (formerly enforced in code — now YOUR contract):
        - "engagement_id": echo the engagement_id from the input
          VERBATIM if one is present; otherwise generate one as
          "eng-" followed by 12 random lowercase hex characters
          (e.g. "eng-3f9a1c0d2b7e").
        - "practice_area": always lowercase.
        - POLICY FLOOR — if "strategic_account" is true then
          "requires_research" MUST be true. Strategic accounts always
          get the research pass; you may raise research, never waive it.
        - "raw_payload": echo the inbound brief payload object VERBATIM.
        - COMPLETENESS — set "requires_human_clarification" to true and
          list the empty ones in "missing_fields" if the brief is missing
          scope_summary, deliverable_type or deadline_utc. (The
          completeness_floor @chain RE-DERIVES both deterministically from
          the canonical fields — you cannot suppress an incomplete brief.)

      Return JSON with these keys (all required):
        - engagement_id: string
        - client_id: string
        - practice_area: string
        - deliverable_type: string
        - scope_summary: string
        - deadline_utc: string
        - strategic_account: boolean
        - requires_research: boolean
        - raw_payload: object
        - requires_human_clarification: boolean
        - missing_fields: list


    enforce_yields: true
    enforce_yields_retry: 3

    yields:
      engagement_id: "string"
      client_id: "string"
      practice_area: "string"
      deliverable_type: "string"
      scope_summary: "string"
      deadline_utc: "string"
      strategic_account: "boolean"
      requires_research: "boolean"
      raw_payload: "object"
      requires_human_clarification: "boolean"   # completeness_floor @chain — true when scope/stakes/deadline missing
      missing_fields: "list"                     # completeness_floor @chain — which required fields were empty

    inputs:
      brief_payload: "object"
      engagement_id: "string"           # @pre_compose pulls any prior brief from it

    context_parts:
      guardrails: |
        Never invent a deliverable_type — if you can't tell, return
        empty so the PM clarifies. Never guess a deadline — vague
        timing is worse than missing.

    can_call:
      # ── Completeness gate — an unworkable brief (missing scope /
      #    stakes / deadline) goes to the lead to clarify with the
      #    client BEFORE any research/context spend. completeness_floor
      #    (@chain) sets requires_human_clarification deterministically;
      #    the LLM cannot suppress it. The two forward edges below carry
      #    the inverse, so they are mutually exclusive with this one.
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_human_clarification == true"

      # Pull client-specific context (only on a workable brief)
      - agent: "context_agent"
        condition: "calling_agent_response.requires_human_clarification == false"

      # Research is the typical path — skipped only for context-pure work
      # (and never on an incomplete brief)
      - agent: "research_agent"
        condition: "calling_agent_response.requires_research == true and calling_agent_response.requires_human_clarification == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # research_agent — knowledge-grounded research
  # ────────────────────────────────────────────────────────────
  research_agent:
    name: "research_agent"
    agent_type: "llm"
    description: "Pulls past projects, industry reports, and methodology relevant to the brief"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    communication_type: "dual"          # bidirectional — context can call research

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"findings": [], "knowledge_gaps": [], "confidence": 0}

      NOTE: a @pre_compose processor has already pulled your research
      corpus for this engagement (research_corpus) and the set of
      retrievable source ids (resolvable_source_ids) into prepared_data.
      Cite ONLY from that corpus — every source_id you cite must be in
      resolvable_source_ids. Do not invent sources.

      Pull relevant prior art for this engagement: similar past
      projects (cite the engagement_id), industry reports, public
      data, and any methodology pointers from the knowledge base.

      DO NOT fabricate sources. If you don't find good prior art for
      a sub-topic, set knowledge_gaps to include it — that's the
      signal the knowledge base needs new ingestion.

      Output structured findings, not prose. Each finding must include
      a source identifier (past_project_id, report_id, URL, etc.).

      Hard rules (formerly enforced in code — now YOUR contract):
        - Every entry in "findings" is an object
          {topic, summary, source_id, confidence}. DROP any finding
          whose source_id is empty — citation-or-nothing.
        - Clamp every confidence value (per-finding and the top-level
          "confidence") to the range 0..1.
        - POST-HITL RE-ENTRY: if the input contains a human_message
          (an IC kicked a draft back with 'needs_more_research'), treat
          that message as the specific research instruction and focus
          this pass on it. If the engagement brief is not recoverable
          from the input, still run the pass on the instruction alone
          and note in "knowledge_gaps" that the brief context was lost.

      Return JSON with these keys (all required):
        - findings: list
        - knowledge_gaps: list
        - confidence: number


    enforce_yields: true
    enforce_yields_retry: 2

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "industry_reports"

    yields:
      findings: "list"                  # list of {topic, summary, source_id, confidence}
      knowledge_gaps: "list"            # topics with no good source — flag for ingestion
      confidence: "number"

    inputs:
      upstream_yields: "object"
      engagement_id: "string"           # @pre_compose pulls the corpus for the brief's practice area

    context_parts:
      guardrails: |
        Every finding must cite a source. Empty source = drop the
        finding. False citations destroy trust in deliverables.

    narration: |
      Surface every unfilled gap in the knowledge_gaps yield — it rides
      the fan-in into consultant_agent and on into qa_agent, where a
      strategic_account with shaky support trips the sme_human / partner
      tier wires before the engagement lead's mandatory review. (No
      direct research→lead edge: research fans IN to the consultant, it
      does not branch to a human mid-pass.)

    can_call:
      # Peer-to-peer with context — research can ask context for
      # client-specific history when it finds an interesting pattern
      - agent: "context_agent"
        condition: "calling_agent_response.confidence >= 0.5"

      # Fan-in to analysis happens via wait_for on analysis side

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # context_agent — client-specific history + relationships
  # ────────────────────────────────────────────────────────────
  context_agent:
    name: "context_agent"
    agent_type: "llm"
    description: "Pulls client-specific history, prior engagements, current relationships, open threads"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    communication_type: "dual"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"client_history": [], "stakeholders": [], "open_threads": [], "sensitivities": [], "confidence": 0, "context_retry_exhausted": false}

      NOTE: a @pre_compose processor has already pulled this client's
      ACCOUNT context (account, prior_engagements, stakeholders,
      open_threads, sensitivities) into prepared_data. Reason over THAT
      material — do not invent client history.

      Pull client-specific context for this engagement: prior
      engagements with this client, current stakeholder map, open
      threads from recent communications, known sensitivities or
      preferences.

      Cite each piece of context (prior_engagement_id, CRM record,
      meeting note ID).

      If this is a follow-up question on an active engagement (entry
      point client_question), focus on the SPECIFIC thread the
      client is asking about — don't dump unrelated history.

      Hard rules (formerly enforced in code — now YOUR contract):
        - Clamp "confidence" to the range 0..1.
        - Always set "context_retry_exhausted" to false — the
          loop-guard micro-module (the ONLY Python on this agent)
          overwrites it from the per-session bounce counter.

      Return JSON with these keys (all required):
        - client_history: list
        - stakeholders: list
        - open_threads: list
        - sensitivities: list
        - confidence: number
        - context_retry_exhausted: boolean


    enforce_yields: true
    enforce_yields_retry: 2

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "client_context"

    yields:
      client_history: "list"
      stakeholders: "list"
      open_threads: "list"
      sensitivities: "list"
      confidence: "number"
      context_retry_exhausted: "boolean"   # loop guard — true after one context↔research bounce

    inputs:
      upstream_yields: "object"
      engagement_id: "string"           # @pre_compose pulls the client account context from it

    can_call:
      # Peer-to-peer — context can ask research for prior-art when
      # it spots a pattern it's seen before. BOUNDED to one bounce per
      # session (context_retry_exhausted, stash counter) — research's
      # own confidence >= 0.5 edge points back here, and two stable
      # confidences would otherwise ping-pong until the chain cap.
      - agent: "research_agent"
        condition: "calling_agent_response.confidence < 0.6 and calling_agent_response.context_retry_exhausted == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # consultant_agent — analysis + first-pass deliverable (merged 2.3.x)
  # Absorbed the former analysis and draft agents: one consultant
  # analyses the research + client context AND writes the first-pass
  # deliverable in one pass — exactly like a human consultant.
  # ────────────────────────────────────────────────────────────
  consultant_agent:
    name: "consultant_agent"
    agent_type: "llm"
    description: "Reasons over research+context, then writes the first-pass deliverable with [cite:] tags"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 6000        # max of the two absorbed stages (draft needed 6000)
    communication_type: "chain"

    thinking: true
    thinking_budget: 8192
    reasoning: true
    enable_prompt_caching: true

    # Fan-in: requires context (always); research optional (?-marked)
    wait_for: "context_agent AND research_agent?"
    wait_for_timeout: 90

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"hypothesis": "", "supporting_evidence": [], "counter_considerations": [], "open_questions": [], "confidence": 0, "requires_sme_review": false, "executive_takeaway": "", "deliverable_id": "", "sections": [], "citations": [], "practice_area": "", "deliverable_type": "", "strategic_account": false, "engagement_id": ""}

      NOTE: a @pre_compose processor has already pulled your context —
      the brief, the research corpus, the client account (stakeholders,
      open threads, sensitivities), and prior deliverables — into
      prepared_data. Reason over THAT material; do not invent sources.

      You are the consultant on this engagement. Work the brief in
      two responsibilities, in order.

      Responsibility 1 — ANALYSE. Synthesise research + client context
      into the analysis that drives the deliverable:
        - hypothesis: the lead recommendation or finding (one sentence)
        - supporting_evidence: list of citations (findings + sources)
        - counter_considerations: list of what argues against
        - open_questions: list of what we still need to confirm
        - confidence: 0..1 — calibrate carefully
        - requires_sme_review: true if confidence < 0.7 OR hypothesis
          lacks supporting evidence
        - executive_takeaway: 4-6 sentence narrative the partner /
          client-facing senior will read. Lead with the recommendation
          and its single strongest piece of evidence. Note the biggest
          counter-consideration. Make it ready-for-slide-1 of the deck.
      Reason carefully — use thinking budget. A weakly-supported
      recommendation costs the engagement.

      Responsibility 2 — DRAFT. Write the first-pass deliverable from
      YOUR analysis, per the deliverable_type (memo / section / chart /
      recommendation / report). Structure depends on type:
        - memo: TL;DR → context → analysis → recommendation → next steps
        - deck section: title → 1 key message → 3 supporting bullets → footnote
        - model: assumptions table → calculation → sensitivity → output
        - report: executive summary → findings → methodology → appendix
        - recommendation: clear ask → 3 reasons → risks → next steps
      Every factual claim must be tagged with [cite: source_id] in
      the text. citation_agent will verify each tag points to a
      retrievable source. If you can't find a source for a claim,
      either rephrase to remove the claim or mark it [unverified].

      Hard rules (formerly enforced in code — now YOUR contract):
        - If "confidence" < 0.7 then "requires_sme_review" MUST be true.
        - If "hypothesis" is non-empty but "supporting_evidence" is
          empty: set "requires_sme_review" to true AND cap "confidence"
          at 0.5 — an evidence-free recommendation is poison.
        - "executive_takeaway" must never be empty when a hypothesis
          exists. If you have nothing better, compose it as:
          "Recommendation: <hypothesis>. Strongest evidence: <first
          evidence>. Largest counter-consideration: <first counter>.
          Confidence <confidence>."
        - "deliverable_id": echo an upstream deliverable_id VERBATIM if
          one exists in your input; otherwise generate one as "del-"
          followed by 12 random lowercase hex characters.
        - "citations" must list EVERY [cite: source_id] tag appearing
          in your section bodies as {source_id, section}. Never return
          sections containing [cite:] tags with an empty citations list.
        - Tier-routing passthrough — echo these from the engagement
          brief in your input/context VERBATIM (empty string / false
          when unknown): "practice_area" (lowercase),
          "deliverable_type", "strategic_account". The QA agent's
          outbound wires pick the human editing tier from them.

      Return JSON with these keys (all required):
        - hypothesis: string
        - supporting_evidence: list
        - counter_considerations: list
        - open_questions: list
        - confidence: number
        - requires_sme_review: boolean
        - executive_takeaway: string
        - deliverable_id: string
        - sections: list
        - citations: list
        - practice_area: string
        - deliverable_type: string
        - strategic_account: boolean
        - engagement_id: string

    enforce_yields: true
    enforce_yields_retry: 2

    # knowledge: methodology kept from the absorbed analysis stage —
    # the reasoning step is the judgment that needs KB grounding; the
    # deliverable structure (former delivery_style) is fully specified
    # in the prompt.
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "methodology"

    yields:
      hypothesis: "string"
      supporting_evidence: "list"
      counter_considerations: "list"
      open_questions: "list"
      confidence: "number"
      requires_sme_review: "boolean"
      executive_takeaway: "string"
      deliverable_id: "string"
      sections: "list"                  # [{title, body, deliverable_type}]
      citations: "list"                 # [source_id, claim] pairs
      practice_area: "string"           # passthrough — qa's tier wires read it
      deliverable_type: "string"        # passthrough — qa's tier wires read it
      strategic_account: "boolean"      # passthrough — qa's tier wires read it
      engagement_id: "string"           # passthrough — qa's @pre_compose pulls the record from it

    inputs:
      upstream_yields: "object"
      engagement_id: "string"           # @pre_compose pulls the brief + corpus + account from it

    context_parts:
      guardrails: |
        Never overstate confidence. Recommendations a partner can't
        defend with the supporting evidence are net-negative — they
        damage the firm's reputation.
      care: |
        The client reads this. Be specific, not generic. Their name
        and context appear in the first sentence. No "We are excited
        to present…" boilerplate.

    can_call:
      # SME path — confidence shaky and the analysis is in-scope of
      # a domain SME
      - agent: "sme_human"
        condition: "calling_agent_response.requires_sme_review == true or calling_agent_response.confidence < 0.6"

      # QA pass on the draft — gated by the former analysis→draft
      # internal-edge condition, so shaky analyses route to the SME
      # first, exactly as before the merge.
      - agent: "qa_agent"
        condition: "calling_agent_response.confidence >= 0.6 and calling_agent_response.requires_sme_review == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # qa_agent — fact-check + consistency + tone
  # Also the LAST agent before the human gates: its micro-module
  # (the only Python on it) stashes the deliverable context per
  # session so a post-HITL kick-back (associate → research) can
  # recover the engagement. The stakes→tier matrix for the human
  # editing pass lives as VISIBLE conditions on its outbound wires.
  # ────────────────────────────────────────────────────────────
  qa_agent:
    name: "qa_agent"
    agent_type: "llm"
    description: "Verifies citations point to retrievable sources; flags uncited claims; checks consistency + tone"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1500
    communication_type: "chain"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"approved": false, "uncited_claims": [], "bad_citations": [], "contradictions": [], "tone_issues": [], "pii_concerns": [], "has_factual_claims": false, "deliverable_id": "", "sections": [], "practice_area": "", "deliverable_type": "", "strategic_account": false, "confidence": 0, "review_tier": ""}
      QA pass on the draft. Check:
        - Every factual claim has a [cite: source_id] tag
        - Every cite points to a real source in the research findings
          or client_context
        - No internal contradictions (e.g., "revenue grew 15%" in
          one section vs "revenue grew 22%" in another)
        - Tone matches the deliverable_type + client sensitivities
        - No PII exposed (client names, employee names where they
          don't belong)

      Output:
        - uncited_claims: list of claim strings without [cite:]
        - bad_citations: list of [cite: X] where X doesn't resolve
        - contradictions: list
        - tone_issues: list
        - pii_concerns: list
        - approved: true only if all the above lists are empty
                    OR all issues are minor (tone only, no factual)

      Hard rules (formerly enforced in code — now YOUR contract):
        - "approved" MUST be false whenever "uncited_claims",
          "bad_citations" or "contradictions" is non-empty — no
          exceptions, no judgment calls. (The qa_floor @chain ENFORCES
          this in Python — you cannot waive it.)
        - "review_tier": leave "" — the qa_floor @chain derives it
          deterministically from the stakes (associate | senior | sme |
          partner). Anything you put here is overwritten.
        - "has_factual_claims": true if the draft makes any factual
          claim at all — any [cite:] tag in a section body or any
          uncited claim counts.
        - Identity passthrough — echo VERBATIM from the consultant's
          draft: "deliverable_id" and "sections" (the lead reviews the
          actual draft), plus the tier-routing fields "practice_area",
          "deliverable_type", "strategic_account" and "confidence"
          (your outbound wires pick the human editing tier from them;
          empty string / false / 0 when genuinely unknown).

      Return JSON with these keys (all required):
        - approved: boolean
        - uncited_claims: list
        - bad_citations: list
        - contradictions: list
        - tone_issues: list
        - pii_concerns: list
        - has_factual_claims: boolean
        - deliverable_id: string
        - sections: list
        - practice_area: string
        - deliverable_type: string
        - strategic_account: boolean
        - confidence: number
        - review_tier: string


    enforce_yields: true
    enforce_yields_retry: 2

    yields:
      approved: "boolean"
      uncited_claims: "list"
      bad_citations: "list"
      contradictions: "list"
      tone_issues: "list"
      pii_concerns: "list"
      has_factual_claims: "boolean"
      deliverable_id: "string"          # Identity passthrough — lead sees WHICH deliverable
      sections: "list"                  # Identity passthrough — lead reviews the actual draft
      practice_area: "string"           # Passthrough — tier wires below read it
      deliverable_type: "string"        # Passthrough — tier wires below read it
      strategic_account: "boolean"      # Passthrough — tier wires below read it
      confidence: "number"              # Passthrough — consultant's calibrated confidence
      review_tier: "string"             # Derived by qa_floor (Python @chain): associate|senior|sme|partner

    inputs:
      upstream_yields: "object"
      engagement_id: "string"           # @pre_compose pulls the engagement record from it

    context_parts:
      guardrails: |
        Citation-or-nothing is THE cardinal rule. Any factual claim
        without a real, retrievable source is a defect. Don't pass
        a draft with uncited factual claims under any condition.

    narration: |
      PII on client-facing material is a firm-level escalation: the
      pii_concerns wire below routes straight to partner_human and the
      three IC-tier wires are mutually exclusive with it (each carries
      pii_concerns == []), so a PII draft never quietly lands on an
      associate's desk.
      When the tier-routing fields come back empty/low (no practice_area,
      confidence 0) the sme_human wire claims it (confidence < 0.7) —
      surfaced for expert eyes rather than treated as routine.

    can_call:
      # Always engage citation_agent on drafts with factual claims —
      # double-check of citation validity
      - agent: "citation_agent"
        condition: "calling_agent_response.has_factual_claims == true"

      # Always reach engagement_lead — never bypass the human review
      - agent: "engagement_lead_human"
        condition: "true"

      # ── PII escalation — firm-level, beats the IC-tier matrix ──
      # Any PII concern on client-facing material goes straight to the
      # partner; the three tier wires below all carry pii_concerns == []
      # so they are mutually exclusive with this one (no double-route).
      - agent: "partner_human"
        condition: "calling_agent_response.pii_concerns != []"

      # ── Stakes→tier matrix for the human editing pass ──────────
      # (formerly hidden inside delivery_router_agent's module — now
      # VISIBLE wires; order of precedence: pii beats sme beats senior
      # beats associate, encoded by mutually-exclusive conditions)
      # SME: regulated practice area OR shaky consultant confidence
      - agent: "sme_human"
        condition: "calling_agent_response.pii_concerns == [] and (calling_agent_response.practice_area == 'regulated' or calling_agent_response.practice_area == 'tax' or calling_agent_response.practice_area == 'healthcare' or calling_agent_response.practice_area == 'security' or calling_agent_response.practice_area == 'legal' or calling_agent_response.confidence < 0.7)"

      # Senior: recommendation deliverable or strategic account
      # (and NOT an SME case)
      - agent: "senior_consultant_human"
        condition: "calling_agent_response.pii_concerns == [] and (calling_agent_response.deliverable_type == 'recommendation' or calling_agent_response.strategic_account == true) and calling_agent_response.confidence >= 0.7 and calling_agent_response.practice_area != 'regulated' and calling_agent_response.practice_area != 'tax' and calling_agent_response.practice_area != 'healthcare' and calling_agent_response.practice_area != 'security' and calling_agent_response.practice_area != 'legal'"

      # Associate: routine — everything the wires above don't claim
      - agent: "associate_human"
        condition: "calling_agent_response.pii_concerns == [] and calling_agent_response.deliverable_type != 'recommendation' and calling_agent_response.strategic_account == false and calling_agent_response.confidence >= 0.7 and calling_agent_response.practice_area != 'regulated' and calling_agent_response.practice_area != 'tax' and calling_agent_response.practice_area != 'healthcare' and calling_agent_response.practice_area != 'security' and calling_agent_response.practice_area != 'legal'"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # citation_agent — programmatic citation verifier
  # ────────────────────────────────────────────────────────────
  citation_agent:
    name: "citation_agent"
    agent_type: "programmatic"
    description: "Verifies each [cite: source_id] points to a retrievable source; flags gaps"
    communication_type: "chain"

    yields:
      total_citations: "number"
      verified_citations: "number"
      missing_sources: "list"          # source_ids that don't resolve
      coverage_pct: "number"           # 0..1 — share of claims with verified cites
      citation_gaps_found: "boolean"

    inputs:
      citations: "list"
      sections: "list"

    narration: |
      coverage_pct < 0.8 means too many claims aren't grounded —
      flag for engagement_lead with a specific recommendation:
      either tighten the claims OR commission a deeper research pass.

    can_call:
      # If citation gaps, the lead sees them on top of QA's flags
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.citation_gaps_found == true"

      # If clean, terminate to audit (engagement_lead already
      # invoked by QA in parallel — this is the side-channel)
      - agent: "delivery_audit_logger_agent"
        condition: "calling_agent_response.citation_gaps_found == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # status_sweep_orchestrator_agent — weekly engagement sweep
  # Active engagements, blockers and overdue deliverables live in
  # YOUR PSA / project tracker (Kantata, Asana, Monday, Jira…) —
  # this connector calls an n8n workflow that queries it and
  # returns the sweep. No template database, no Python module.
  # ────────────────────────────────────────────────────────────
  status_sweep_orchestrator_agent:
    name: "status_sweep_orchestrator_agent"
    agent_type: "programmatic"
    description: "Weekly status sweep across active engagements (from YOUR PSA/project tracker via n8n); surfaces blocked / overdue"
    communication_type: "execute"
    integration: "n8n"
    connector_config:
      # n8n workflow that queries your PSA / project tracker and
      # returns {engagements_swept, blocked_engagements,
      # overdue_engagements, report_url}. Env fallback: N8N_WEBHOOK_URL.
      webhook_url: "${PSA_STATUS_SWEEP_WEBHOOK_URL:}"
      auth_token: "${PSA_STATUS_SWEEP_AUTH_TOKEN:}"
      timeout: 60
    # wake_up: "0 9 * * 1"             # Mondays 09:00 — enable after wiring your PSA/project-tracker connector

    # Connector-returned fields ARE the yields (lenient fill) — any
    # outbound condition on them would be valid.
    yields:
      engagements_swept: "number"
      blocked_engagements: "list"
      overdue_engagements: "list"
      report_url: "string"

    inputs:
      trigger: "string"

    can_call: []                          # terminal — the n8n workflow posts the report to your channel

  # ────────────────────────────────────────────────────────────
  # associate_human — Tier-1 IC
  # ────────────────────────────────────────────────────────────
  associate_human:
    name: "associate_human"
    agent_type: "human"
    is_human_powered: true
    description: "Associate / IC — handles the editing + personalisation on routine deliverables"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 14400         # 4 hours

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "escalate"
      message: "escalate"
      note: "Associate didn't respond — escalating to senior consultant"

    yields:
      decision: "string"                 # approved_for_lead | needs_more_research | escalate
      notes: "string"

    inputs:
      deliverable_id: "string"
      sections: "list"

    human_prompt_template: |
      Draft for your editing pass. The deliverable goes to the
      engagement lead next — make sure tone + specifics fit this
      client. If you need more research, kick back to research_agent
      with a specific ask.

    can_call:
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.human_message == 'approved_for_lead'"

      - agent: "senior_consultant_human"
        condition: "calling_agent_response.human_message == 'escalate'"

      - agent: "research_agent"
        condition: "calling_agent_response.human_message == 'needs_more_research'"

  # ────────────────────────────────────────────────────────────
  # senior_consultant_human — Tier-2
  # ────────────────────────────────────────────────────────────
  senior_consultant_human:
    name: "senior_consultant_human"
    agent_type: "human"
    is_human_powered: true
    description: "Senior consultant — strategic accounts, recommendation deliverables"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 21600         # 6 hours

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "escalate_to_lead"
      message: "escalate_to_lead"
      note: "Senior consultant didn't respond — engagement lead takes the edit pass"

    yields:
      decision: "string"
      notes: "string"

    inputs:
      deliverable_id: "string"

    can_call:
      - agent: "engagement_lead_human"

  # ────────────────────────────────────────────────────────────
  # sme_human — domain SME
  # ────────────────────────────────────────────────────────────
  sme_human:
    name: "sme_human"
    agent_type: "human"
    is_human_powered: true
    description: "Domain SME — depth-of-expertise on the practice area"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 28800         # 8 hours

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "escalate_to_partner"
      message: "escalate_to_partner"
      note: "SME didn't respond — partner escalation"

    yields:
      decision: "string"
      notes: "string"

    inputs:
      deliverable_id: "string"
      practice_area: "string"

    can_call:
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.human_message != 'escalate_to_partner'"

      - agent: "partner_human"
        condition: "calling_agent_response.human_message == 'escalate_to_partner'"

  # ────────────────────────────────────────────────────────────
  # engagement_lead_human — PM + relationship owner (ALWAYS in loop)
  # ────────────────────────────────────────────────────────────
  engagement_lead_human:
    name: "engagement_lead_human"
    agent_type: "human"
    is_human_powered: true
    description: "Engagement lead / PM — owns the relationship; ALWAYS reviews before client sees output"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 21600         # 6 hours

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "hold_for_review"
      message: "hold_for_review"
      note: "Engagement lead didn't respond — deliverable paused for manual review (default-deny)"

    yields:
      decision: "string"                 # approved_for_client | needs_rework | escalate
      notes: "string"

    inputs:
      deliverable_id: "string"
      sections: "list"

    human_prompt_template: |
      Final review BEFORE the client sees this. Take your time —
      reputation matters more than throughput.

    can_call:
      # ── APPROVE → the deliverable_assembler COMPILES the real client
      #    deliverable (the team FINISHES the job), then audits. The
      #    assembler's @chain floor re-checks approval + QA and fails
      #    closed, so a stale/forged approve can never ship a defect.
      - agent: "deliverable_assembler_agent"
        condition: "calling_agent_response.human_message == 'approved_for_client'"

      # Not-approved verdicts (rework / hold) terminate straight to audit —
      # nothing is compiled.
      - agent: "delivery_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'needs_rework' or calling_agent_response.human_message == 'hold_for_review'"

      - agent: "partner_human"
        condition: "calling_agent_response.human_message == 'escalate'"

  # ────────────────────────────────────────────────────────────
  # partner_human — escalation tier
  # ────────────────────────────────────────────────────────────
  partner_human:
    name: "partner_human"
    agent_type: "human"
    is_human_powered: true
    description: "Partner — exec sponsor, escalation tier"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 43200         # 12 hours

    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes this
    #   gate to the SHARED inbox. Only set real operator emails: a
    #   placeholder assigns tasks to a nonexistent operator and they
    #   never appear in anyone's inbox.
    fallback_on_timeout: true
    fallback_response:
      decision: "halt_for_review"
      message: "halt_for_review"
      note: "Partner unavailable — engagement paused for personal review (default-deny)"

    yields:
      decision: "string"
      directive: "string"

    inputs:
      engagement_id: "string"
      escalation_reason: "string"

    can_call:
      - agent: "delivery_audit_logger_agent"

  # ────────────────────────────────────────────────────────────
  # deliverable_assembler_agent — the real artifact-producing executor
  # Runs AFTER the engagement lead approves. COMPILES the approved
  # analysis + citations + exhibits into a formatted client deliverable
  # and renders a REAL file to ./out/<deliverable>.(md|pdf). This is the
  # agent that turns draft-and-route into a team that FINISHES the job.
  #
  # FAIL-CLOSED: its @chain floor (gate_and_render) re-checks BOTH lead
  # approval AND QA (uncited claims / bad citations / contradictions /
  # PII) and refuses to compile anything that wasn't approved or passed
  # QA — no file is produced on a blocked path. Terminates to the audit
  # sink. (Python: a side-effect actuator + a deterministic control floor
  # — exactly the two cases the method says earn a module.)
  # ────────────────────────────────────────────────────────────
  deliverable_assembler_agent:
    name: "deliverable_assembler_agent"
    agent_type: "programmatic"
    description: "Compiles the approved deliverable into a real client document (./out/*.md|pdf); fail-closed on un-approved / QA-failed drafts"
    communication_type: "chain"

    # Set deterministically by the gate_and_render @chain floor — the
    # connector-style fields ARE the yields.
    yields:
      status: "string"                 # compiled | blocked
      blocked: "boolean"               # true when the fail-closed floor stopped the compile
      deliverable_id: "string"
      artifact_path: "string"          # the rendered .md (empty when blocked)
      artifact_paths: "list"           # [.md] or [.md, .pdf]
      pdf_rendered: "boolean"
      section_count: "number"
      citation_count: "number"
      compiled_at_utc: "string"
      summary: "string"
      block_reasons: "list"            # why the compile was refused (fail-closed)
      engagement_id: "string"

    inputs:
      upstream_yields: "object"
      engagement_id: "string"          # @pre_compose recovers the approved deliverable from the session stash + store

    can_call:
      # Terminal — every compile (or block) lands in the WORM audit.
      - agent: "delivery_audit_logger_agent"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # delivery_audit_logger_agent — hash-chained WORM
  # ────────────────────────────────────────────────────────────
  delivery_audit_logger_agent:
    name: "delivery_audit_logger_agent"
    agent_type: "external"
    description: "Hash-chained WORM audit of every QA outcome, edit, approval, escalation"
    framework: "custom"
    communication_type: "execute"

    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/delivery_audit.jsonl"

    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"

    inputs:
      session_id: "string"
      payload: "object"

    can_call: []

  # ────────────────────────────────────────────────────────────
  # engagement_status_drafter_agent — Friday status reports for clients
  # Real-world consulting pain: writing the weekly client update.
  # Pulls session activity + open questions + next-week plan.
  # ────────────────────────────────────────────────────────────
  engagement_status_drafter_agent:
    name: "engagement_status_drafter_agent"
    agent_type: "llm"
    description: "Drafts the weekly Friday client status report from session activity + open threads"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 2000
    communication_type: "chain"
    wake_up: "0 14 * * 5"               # Friday 14:00 — drafts before EOD

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"client_facing_summary": "", "this_week_accomplishments": [], "blockers_for_client": [], "next_week_plan": [], "open_questions": [], "confidence_in_timeline": 0, "tone_used": ""}
      Draft the weekly client status report. Return JSON with these keys:
        - client_facing_summary: what we did this week, in client voice
          (3-4 short paragraphs, no jargon, lead with outcomes)
        - this_week_accomplishments: ordered list of {item, evidence_link}
        - blockers_for_client: items where we need the client to act
          (each with the specific ask + deadline)
        - next_week_plan: ordered list of what we're doing next week
        - open_questions: list of {question, owner, deadline}
        - confidence_in_timeline: 0..1
        - tone_used: warm | direct | technical (match the engagement)

      Lead with outcomes, not activities. The client cares about progress
      toward their goal, not how many calls we had.

      Hard rules (formerly enforced in code — now YOUR contract):
        - "tone_used" must be exactly one of: warm | direct |
          technical. Default to "warm" when unsure.
        - Clamp "confidence_in_timeline" to the range 0..1.
        - Empty-week floor: if there are no accomplishments AND no
          summary content this week, set "confidence_in_timeline" to
          at most 0.3 — the lead must review carefully.

    enforce_yields: true
    enforce_yields_retry: 1

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "client_context"

    yields:
      client_facing_summary: "string"
      this_week_accomplishments: "list"
      blockers_for_client: "list"
      next_week_plan: "list"
      open_questions: "list"
      confidence_in_timeline: "number"
      tone_used: "string"

    inputs:
      engagement_id: "string"

    can_call:
      # Engagement lead reviews + sends — never auto-sent to client
      - agent: "engagement_lead_human"

  # ────────────────────────────────────────────────────────────
  # timesheet_connector_agent — YOUR PSA/timesheet system of record
  # Billable hours do NOT live in a template SQLite file — they live
  # in the firm's PSA/timesheet system (Harvest, Toggl, ClickTime,
  # Tempo, Kantata…). This connector calls an n8n workflow that
  # fronts that system: ingest mode forwards one time entry; report
  # mode returns the engagement's aggregated hours + budget position.
  # Pure YAML — no Python module.
  # ────────────────────────────────────────────────────────────
  timesheet_connector_agent:
    name: "timesheet_connector_agent"
    agent_type: "programmatic"
    description: "Hours + budget position from YOUR PSA/timesheet system (Harvest / Toggl / ClickTime / Tempo via n8n)"
    communication_type: "chain"
    integration: "n8n"
    connector_config:
      # n8n workflow fronting your PSA/timesheet API. Ingest payloads
      # carry {engagement_id, consultant_id, activity, hours, billable,
      # date, rate_cents}; report payloads carry {engagement_id}.
      # The workflow returns the aggregate fields declared in yields.
      # Env fallback: N8N_WEBHOOK_URL.
      webhook_url: "${PSA_TIMESHEET_WEBHOOK_URL:}"
      auth_token: "${PSA_TIMESHEET_AUTH_TOKEN:}"
      timeout: 60
    # wake_up: "0 8 * * 1"             # weekly hours pull — enable after wiring your PSA/timesheet connector

    # Connector-returned fields ARE the yields (lenient fill) — the
    # outbound condition below evaluates on them.
    yields:
      engagement_id: "string"
      total_billable_hours: "number"
      total_non_billable_hours: "number"
      total_billable_cents: "number"
      utilisation_pct: "number"           # billable / (billable + non-billable)
      entries_count: "number"
      budget_utilisation: "number"        # billable hours / SOW budget (PSA knows the budget)
      over_budget: "boolean"

    inputs:
      engagement_id: "string"
      mode: "string"                      # ingest | report — your n8n workflow branches on it
      consultant_id: "string"
      activity: "string"
      hours: "number"
      billable: "boolean"
      date: "string"
      rate_cents: "number"

    can_call:
      # Hand the numbers to the controller for the SOW-drift judgment —
      # only when the PSA actually resolved the engagement
      - agent: "engagement_controller_agent"
        condition: "calling_agent_response.engagement_id != ''"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # engagement_controller_agent — SOW-drift judgment (pure YAML)
  # The hours ledger is NOT here any more: billable hours live in
  # YOUR PSA/timesheet system and arrive via timesheet_connector_agent.
  # This agent is the JUDGMENT on top of those numbers — scope drift,
  # change-order candidates, the lead briefing.
  # ────────────────────────────────────────────────────────────
  engagement_controller_agent:
    name: "engagement_controller_agent"
    agent_type: "llm"
    description: "SOW-drift judgment over PSA-supplied hours — surfaces scope creep and change-order candidates"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    communication_type: "chain"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"engagement_id": "", "total_billable_hours": 0, "total_non_billable_hours": 0, "total_billable_cents": 0, "utilisation_pct": 0, "entries_count": 0, "time_briefing": "", "budget_utilisation": 0, "over_budget": false, "scope_drift_items": [], "change_order_candidates": [], "severity_score": 0, "requires_lead_action": false, "scope_briefing": "", "control_trips": []}
      You are the engagement controller. The hours numbers come from
      the firm's PSA/timesheet system (via timesheet_connector_agent)
      — your job is the JUDGMENT on top of them.

      Compare the engagement's SOW against the supplied hours and
      recent client correspondence:
        - scope_drift_items: list of objects {activity, hours, why_not_in_sow}
        - change_order_candidates: list of objects {request, source,
            estimated_hours, estimated_value_cents}
        - scope_briefing: 3 sentence narrative for the engagement lead.
          Lead with the bigger problem (budget vs unquoted requests).
          Cite specifics. Recommend the next conversation with the client.

      Hard rules (formerly enforced in code — now YOUR contract):
        - Identity passthrough — echo VERBATIM from the timesheet
          connector input: "engagement_id", "total_billable_hours",
          "total_non_billable_hours", "total_billable_cents",
          "utilisation_pct", "entries_count", "budget_utilisation",
          "over_budget". NEVER recompute or invent these — the PSA is
          the system of record. Use 0 / false when a field is absent.
        - "time_briefing": one sentence summarising the hours position
          from those numbers (billable vs non-billable, utilisation,
          amount billed).
        - "severity_score" (0..1) = min(0.5, max(0, budget_utilisation
          - 0.85)) + min(0.3, 0.1 × count of scope_drift_items)
          + min(0.2, 0.1 × count of change_order_candidates),
          capped at 1.0. (The control_floor @chain RE-COMPUTES this in
          Python — your value is a sanity check, not the authority.)
        - "requires_lead_action" MUST be true when over_budget is true
          OR there is at least one change-order candidate; false
          otherwise. (The control_floor @chain ENFORCES escalation on ANY
          tripped control — over budget, budget burn >= 90%, a change
          order, scope drift, or collapsed utilisation — and you CANNOT
          waive it.)
        - "control_trips": leave [] — the control_floor @chain fills it
          with the named controls that fired (e.g. ["over_budget",
          "budget_burn"]). Anything you put here is overwritten.
        - "scope_briefing" must never be empty — if there is nothing
          to flag, say so explicitly ("On budget. No drift items. No
          action this cycle.").

    enforce_yields: true
    enforce_yields_retry: 2

    # knowledge: engagement_sow_library — the SOW-vs-actuals judgment
    # is the stage that needs KB context; the hours maths is the PSA's.
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "engagement_sow_library"

    yields:
      engagement_id: "string"             # echoed from the PSA connector
      total_billable_hours: "number"      # echoed from the PSA connector
      total_non_billable_hours: "number"  # echoed from the PSA connector
      total_billable_cents: "number"      # echoed from the PSA connector
      utilisation_pct: "number"           # echoed from the PSA connector
      entries_count: "number"             # echoed from the PSA connector
      time_briefing: "string"
      budget_utilisation: "number"        # echoed from the PSA connector
      over_budget: "boolean"              # echoed from the PSA connector
      scope_drift_items: "list"
      change_order_candidates: "list"
      severity_score: "number"           # RE-COMPUTED by control_floor (@chain)
      requires_lead_action: "boolean"     # FORCED true by control_floor on any tripped control
      scope_briefing: "string"
      control_trips: "list"               # control_floor (@chain) — named controls that fired

    inputs:
      upstream_yields: "object"
      engagement_id: "string"

    can_call:
      # Lead action required → engagement_lead reviews
      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_lead_action == true"

      # No action → terminal audit
      - agent: "delivery_audit_logger_agent"
        condition: "calling_agent_response.requires_lead_action == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # performance_review_agent — billable consultant reviews
  # Client-facing dims weighted higher than internal utilisation
  # ────────────────────────────────────────────────────────────
  performance_review_agent:
    name: "performance_review_agent"
    agent_type: "llm"
    description: "Q/annual review for consultants — client csat + repeat engagement + outcomes weighted over utilisation"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 2000
    communication_type: "chain"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"review_id": "", "consultant_id": "", "period": "", "client_csat_avg": 0, "repeat_engagement_pct": 0, "outcomes_delivered_count": 0, "utilisation_pct": 0, "composite_score": 0, "rating": "", "client_quotes": [], "requires_calibration": false, "requires_partner_review": false, "requires_pip": false, "requires_managed_exit": false, "generated_at_utc": "", "engagement_id": "", "escalation_reason": ""}
      Draft the consultant's review based on engagement feedback,
      repeat client patterns, business outcomes delivered, and
      utilisation. Be specific — cite engagements + outcomes by
      anonymised reference (engagement_id, not client name).

      Lead with client-facing impact. Internal-only metrics matter
      less. NEVER reference protected attributes.

      Hard rules (the rating_floor @chain RE-COMPUTES the scoring and
      DERIVES every consequence flag in Python — you cannot nudge a
      score across a band; these are your sanity checks, not the
      authority):
        - "review_id": "svc-review-<consultant_id>-<period>".
        - "client_csat_avg": mean of the csat values in the client
          feedback input (0 when none), rounded to 2 decimals.
        - "composite_score" = 0.40 × client_csat_avg
          + 0.20 × repeat_engagement_pct
          + 0.20 × min(1, outcomes_delivered_count / 3)
          + 0.20 × min(1, utilisation_pct / 75)
          — clamp to 0..1, round to 2 decimals.
        - "rating" bands on composite_score: >= 0.90 principal_track,
          >= 0.75 exceeds, >= 0.60 meets, >= 0.40 improvement_plan,
          below that managed_exit.
        - Flags: "requires_partner_review" true ONLY for
          principal_track; "requires_calibration" true for
          principal_track or managed_exit; "requires_pip" true for
          improvement_plan; "requires_managed_exit" true for
          managed_exit. (Derived deterministically by the @chain.)
        - "client_quotes": at most 5 verbatim quotes from the feedback.
        - "generated_at_utc": current UTC time, ISO-8601.
        - Identity passthrough — echo "engagement_id" VERBATIM from
          the input (empty string when absent). Set
          "escalation_reason" to "consultant <consultant_id> rated
          <rating> (composite <score>) — partner calibration required"
          when requires_partner_review is true, else empty string.
      The firm's HR system of record stores the signed review — this
      agent only DRAFTS it.

    enforce_yields: true

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "consultant_review_rubric"

    yields:
      review_id: "string"
      consultant_id: "string"
      period: "string"
      client_csat_avg: "number"
      repeat_engagement_pct: "number"
      outcomes_delivered_count: "number"
      utilisation_pct: "number"
      composite_score: "number"
      rating: "string"
      client_quotes: "list"
      requires_calibration: "boolean"
      requires_partner_review: "boolean"
      requires_pip: "boolean"
      requires_managed_exit: "boolean"
      generated_at_utc: "string"
      engagement_id: "string"          # Identity passthrough — partner sees WHICH engagement
      escalation_reason: "string"      # Identity passthrough — partner sees WHY escalated

    inputs:
      upstream_yields: "object"
      consultant_id: "string"
      period: "string"

    can_call:
      - agent: "partner_human"
        condition: "calling_agent_response.requires_partner_review == true"

      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_pip == true or calling_agent_response.requires_managed_exit == true"

      - agent: "engagement_lead_human"
        condition: "calling_agent_response.requires_calibration == false and calling_agent_response.requires_partner_review == false"

    auto_store_response: true
    auto_store_yields: true

  # ────────────────────────────────────────────────────────────
  # doc_extraction_agent — engagement-close knowledge mining
  # ────────────────────────────────────────────────────────────
  doc_extraction_agent:
    name: "doc_extraction_agent"
    agent_type: "llm"
    description: "At engagement close — mines deliverables for reusable IP; anonymises client; tags reusability"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 3000
    communication_type: "chain"

    prompt: |


      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:

      {"engagement_id": "", "entries": [], "kb_entries_count": 0, "high_reusability_count": 0, "skipped_client_specific": 0, "requires_knowledge_lead_review": false, "captured_at_utc": ""}
      Read the engagement's deliverables. Return "entries": a list of
      {title, content, tags, source_doc, reusability}.

      Tags from the controlled vocabulary:
        methodology, framework, model, template, checklist, playbook,
        case_study, research_finding, data_pattern,
        analysis_technique, client_specific.

      Mark `client_specific` for anything that's bespoke to the client's
      context — those skip the firm-wide KB.

      Each extract should stand alone — a future consultant must be
      able to use it without reading the whole engagement.

      Hard rules (formerly enforced in code — now YOUR contract):
        - Drop extracts with an empty title or empty content.
        - Keep ONLY tags from the controlled vocabulary above.
        - SKIP any extract tagged client_specific — do not include it
          in "entries"; count it in "skipped_client_specific".
        - Reusability score per entry: +3 for methodology / framework /
          playbook, +2 for template / checklist / model, +2 for
          case_study / research_finding, +1 for analysis_technique /
          data_pattern. reusability = "high" when score >= 3,
          "medium" when score == 2, otherwise "low".
        - ANONYMISE: replace every mention of the client's name inside
          entry content with "[CLIENT]".
        - "kb_entries_count" = number of entries kept;
          "high_reusability_count" = entries with reusability "high";
          "requires_knowledge_lead_review" = true exactly when
          high_reusability_count > 0.
        - Echo "engagement_id" VERBATIM from the input.
        - "captured_at_utc": current UTC time, ISO-8601.
      Your firm's KB / RAG ingestion pipeline persists the entries —
      this agent only extracts and structures them.

    enforce_yields: true

    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "kb_taxonomy"

    yields:
      engagement_id: "string"
      entries: "list"
      kb_entries_count: "number"
      high_reusability_count: "number"
      skipped_client_specific: "number"
      requires_knowledge_lead_review: "boolean"
      captured_at_utc: "string"

    inputs:
      upstream_yields: "object"
      engagement_id: "string"
      client: "string"

    can_call:
      - agent: "sme_human"
        condition: "calling_agent_response.requires_knowledge_lead_review == true"

    auto_store_response: true
    auto_store_yields: true
